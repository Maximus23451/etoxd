<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176131" />
    <meta name="description" content="ETO játékosportál: heti beosztások, edzések és jelenlét." />
    <title>ETO Játékosportál | Bejelentkezés</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <button class="theme-toggle theme-fab" type="button" data-theme-toggle aria-label="Sötét mód"></button>
    <main class="login-layout">
      <section class="brand-panel" aria-label="ETO Football Club members area">
        <div class="brand-top"><span class="gold-rule"></span><span>ETO · JÁTÉKOSPORTÁL</span></div>
        <div class="brand-mobile-label">JÁTÉKOSPORTÁL</div>
        <div class="brand-copy">
          <img class="crest" src="public/assets/eto-badge.svg" alt="ETO Football Club crest, founded 1904" />
          <h1>EDZÉSEK.<br /><span>JELENLÉT.</span></h1>
          <p>Kövesd a heti beosztást, jelentkezz az edzésekre,<br class="desktop-break" /> és rögzítsd a jelenléted.</p>
        </div>
        <footer class="brand-footer">© 2026 ETO · Próba felület</footer>
      </section>

      <section class="form-panel" aria-labelledby="sign-in-title">
        <div class="form-wrap">
          <span class="gold-rule"></span>
          <h2 id="sign-in-title">BEJELENTKEZÉS</h2>
          <p class="intro">Lépj be az ETO játékosportálra.</p>
          <form id="login-form">
            <label for="username">TALENTX AZONOSÍTÓ</label>
            <div class="input-shell">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.6-4.2 3.1-6.3 7.5-6.3s6.9 2.1 7.5 6.3"/></svg>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="pl. TX-1001" required autofocus />
            </div>

            <label for="password" class="password-label">JELSZÓ</label>
            <div class="input-shell">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Add meg a jelszavad" required />
              <button class="visibility-toggle" type="button" aria-label="Jelszó megjelenítése" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
              </button>
            </div>
            <div class="options-row">
              <label class="remember"><input type="checkbox" name="remember" checked /><span class="checkmark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3.1 3L13 4.5"/></svg></span><span>Maradjak bejelentkezve</span></label>
              <button class="text-link" id="forgot-link" type="button">Elfelejtetted a jelszavad?</button>
            </div>
            <button class="submit-button" type="submit"><span>BELÉPEK</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
            <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
          </form>
          <p class="support">Gond van a belépéssel? <a href="#support" id="support-link">Kapcsolat az adminisztrátorral</a></p>
          <div class="demo-box">
            <p>Demó belépés <span>(jelszó: <code>eto1904</code>)</span></p>
            <div class="demo-chips">
              <button type="button" data-demo-id="TX-1001">Játékos</button>
              <button type="button" data-demo-id="TX-2001">Edző</button>
              <button type="button" data-demo-id="TX-9001">Admin</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
